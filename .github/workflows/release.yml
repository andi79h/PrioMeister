# Tests bei jedem Push und Pull Request. Auf main: Hat die Version in PrioMeister.toc noch keinen Tag,
# setzt der Lauf den Tag v<Version>, baut die Zip mit dem BigWigs-Packager (.pkgmeta) und veröffentlicht
# sie als GitHub-Release und auf CurseForge (Projekt-ID in der TOC, Schlüssel im Secret CF_API_TOKEN).
name: Tests und Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lua 5.1 installieren
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.1
      - name: Tests
        run: lua5.1 tests/run_tests.lua
      - name: Keine neuen globalen Variablen
        run: |
          extra=$(for f in PrioMeister/*.lua; do luac5.1 -l -p "$f"; done | awk '/SETGLOBAL/ { print $NF }' | sort -u | grep -v -x -E 'PrioMeisterDB|SLASH_PRIOMEISTER[0-9]+' || true)
          if [ -n "$extra" ]; then echo "Neue globale Variablen: $extra"; exit 1; fi

  release:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: CurseForge-Schlüssel prüfen
        # vor jedem Release, damit ein abgelaufener oder falscher Schlüssel auffällt, bevor ein Tag entsteht
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then echo "Kein CF_API_TOKEN, CurseForge wird übersprungen."; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-api-token: $CF_API_TOKEN" https://wow.curseforge.com/api/game/wow/versions)
          if [ "$code" != 200 ]; then echo "::error::CurseForge lehnt CF_API_TOKEN ab (HTTP $code)."; exit 1; fi
          echo "CurseForge-Schlüssel gültig."
      - name: Version aus der TOC
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(sed -n 's/^## Version: *//p' PrioMeister/PrioMeister.toc | tr -d '\r')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" > /dev/null; then tag=ja; else tag=nein; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$tag" = ja ] && gh release view "v$v" > /dev/null 2>&1; then
            echo "Version $v ist schon veröffentlicht, nichts zu tun."
            echo "release=ja" >> "$GITHUB_OUTPUT"
          else
            echo "release=nein" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag setzen
        if: steps.version.outputs.tag == 'nein'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "PrioMeister ${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
      - name: Zip bauen und veröffentlichen
        if: steps.version.outputs.release == 'nein'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # release.sh aus v2 liest GITHUB_API_TOKEN oder GITHUB_OAUTH; GH_API_TOKEN kennt erst die neuere Fassung
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Gebaut wird immer der Stand des Tags, auch wenn main inzwischen weiter ist.
          git checkout -q "v${{ steps.version.outputs.version }}"
          curl -fsSL https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh -o "$RUNNER_TEMP/release.sh"
          # Packager-Skript direkt statt BigWigsMods/packager@v2 und mit leerem GITHUB_ACTIONS: Sonst bricht es
          # bei einem Push auf einen Zweig ab, sobald HEAD einen Tag hat, und wartet auf einen eigenen Lauf
          # für den Tag. Den gibt es nicht, denn Tags, die ein Workflow mit GITHUB_TOKEN pusht, starten keine
          # weiteren Workflows. -u: Unix-Zeilenenden, die Zip enthält genau die getesteten Dateien.
          GITHUB_ACTIONS= bash "$RUNNER_TEMP/release.sh" -u
